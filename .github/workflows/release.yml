name: Build and Release

on:
    push:
        tags:
            - "v*"

jobs:
    build:
        runs-on: windows-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Add MSBuild to PATH
              uses: microsoft/setup-msbuild@v2

            - name: Setup WiX Toolset
              run: |
                  dotnet tool install --global wix
                  wix extension add WixToolset.UI.wixext
              shell: pwsh

            - name: Build x86 Release
              run: msbuild RBTray.sln /p:Configuration=Release /p:Platform=x86 /m

            - name: Build x64 Release
              run: msbuild RBTray.sln /p:Configuration=Release /p:Platform=x64 /m

            - name: Create release package
              run: |
                  New-Item -ItemType Directory -Force -Path release
                  Copy-Item x86\Release\RBTray.exe release\RBTray-x86.exe
                  Copy-Item x86\Release\RBHook.dll release\RBHook-x86.dll
                  Copy-Item x64\Release\RBTray.exe release\RBTray-x64.exe
                  Copy-Item x64\Release\RBHook.dll release\RBHook-x64.dll
                  Copy-Item LICENSE.txt release\
                  Copy-Item README.md release\
                  Copy-Item CHANGELOG.md release\
              shell: pwsh

            - name: Create ZIP archives
              run: |
                  Compress-Archive -Path release\RBTray-x86.exe, release\RBHook-x86.dll, release\LICENSE.txt, release\README.md, release\CHANGELOG.md -DestinationPath RBTray-x86.zip
                  Compress-Archive -Path release\RBTray-x64.exe, release\RBHook-x64.dll, release\LICENSE.txt, release\README.md, release\CHANGELOG.md -DestinationPath RBTray-x64.zip
              shell: pwsh

            - name: Create WiX installers
              run: |
                  $version = "${{ github.ref_name }}".TrimStart('v')

                  # x86 installer
                  wix build installer\RBTray-x86.wxs -arch x86 -d Version=$version -d SourceDir=x86\Release -out RBTray-x86.msi

                  # x64 installer
                  wix build installer\RBTray-x64.wxs -arch x64 -d Version=$version -d SourceDir=x64\Release -out RBTray-x64.msi
              shell: pwsh

            - name: Create GitHub Release
              uses: softprops/action-gh-release@v2
              with:
                  files: |
                      RBTray-x86.zip
                      RBTray-x64.zip
                      RBTray-x86.msi
                      RBTray-x64.msi
                  body_path: CHANGELOG.md
                  draft: false
                  prerelease: false
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
